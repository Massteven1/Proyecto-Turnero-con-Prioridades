$kind: http-request
name: 11. GET /api/v1/categorias — listar categorías
description: |-
  Contrato: ADMIN y OPERADOR. Las cuatro categorías base, siempre activas: Discapacidad, Embarazada y Adulto mayor preferentes; Regular no.
  Copia de «4. Catálogos (ADMIN-OPERADOR) / GET — categorías (200)». Guarda el nombre vigente de la categoría 3 para la petición 12.
url: "{{baseUrl}}/api/v1/categorias"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test('son las cuatro categorías base, activas', () => {
        pm.expect(r.map(c => c.id)).to.eql([1, 2, 3, 4]);
        r.forEach(c => pm.expect(c.activo).to.eql(true));
      });
      pm.test('tres preferentes y Regular no preferente', () => {
        pm.expect(r.filter(c => c.preferente === true).length).to.eql(3);
        pm.expect(r.find(c => c.id === 4).preferente).to.eql(false);
      });
      pm.test('campos del CategoriaDTO', () => {
        r.forEach(c => pm.expect(c).to.have.all.keys('id', 'nombre', 'preferente', 'activo'));
      });
      pm.collectionVariables.set('docCategoriaNombre', r.find(c => c.id === 3).nombre);
    language: text/javascript
order: 11000
