$kind: http-request
description: |-
  El servicio de prueba no tiene turnos, así que su baja lógica es válida y desactiva
  en cascada todos sus módulos (incluido el módulo creado en esta corrida).
url: "{{baseUrl}}/api/v1/servicios/{{servicioCreadoId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: '{"nombre":"{{servicioNombre}} Renombrado","descripcion":"Renombrado por la colección","activo":false}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test('queda inactivo', () => pm.expect(r.activo).to.eql(false));
    language: text/javascript
order: 18000