$kind: http-request
description: |-
  Servicio inexistente: 404 al bloquear el servicio (antes de tocar estado de cola).
url: "{{baseUrl}}/api/v1/parametros-cola/9999"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: '{"umbralEnvejecimientoMin":15,"proporcionPreferente":3}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      const r = pm.response.json();
      pm.test('ErrorResponseDTO', () => {
        pm.expect(r.status).to.eql(404);
        pm.expect(r.mensaje).to.include('Servicio');
      });
    language: text/javascript
order: 35000