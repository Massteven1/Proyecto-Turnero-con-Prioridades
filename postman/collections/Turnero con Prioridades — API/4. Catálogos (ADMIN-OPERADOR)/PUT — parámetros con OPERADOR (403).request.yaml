$kind: http-request
description: |-
  Actualizar parámetros es exclusivo de ADMIN: OPERADOR recibe 403.
url: "{{baseUrl}}/api/v1/parametros-cola/1"
method: PUT
headers:
  Authorization: Bearer {{tokenOperador}}
  Content-Type: application/json
body:
  type: text
  content: '{"umbralEnvejecimientoMin":15,"proporcionPreferente":3}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      const r = pm.response.json();
      pm.test('ErrorResponseDTO', () => pm.expect(r.status).to.eql(403));
    language: text/javascript
order: 36000