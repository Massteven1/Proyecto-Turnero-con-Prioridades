$kind: http-request
description: |-
  El módulo 1 tiene el turno LLAMADO CAJ-20261111-001: no puede desactivarse.
url: "{{baseUrl}}/api/v1/modulos/1"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: '{"servicioId":1,"nombre":"Ventanilla Caja 1","activo":false}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 Conflict', () => pm.response.to.have.status(409));
      const r = pm.response.json();
      pm.test('mensaje de turno activo', () => pm.expect(r.mensaje).to.include('turno activo'));
    language: text/javascript
order: 17000