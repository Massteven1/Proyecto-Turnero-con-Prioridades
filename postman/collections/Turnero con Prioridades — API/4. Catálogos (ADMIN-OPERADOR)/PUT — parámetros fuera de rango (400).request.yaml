$kind: http-request
description: |-
  Rangos del contrato: umbral 1-240 y proporción 1-10. Fuera de rango responde 400.
url: "{{baseUrl}}/api/v1/parametros-cola/1"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: '{"umbralEnvejecimientoMin":0,"proporcionPreferente":11}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      const r = pm.response.json();
      pm.test('detalles de ambos campos', () => {
        pm.expect(r.detallesValidacion).to.have.property('umbralEnvejecimientoMin');
        pm.expect(r.detallesValidacion).to.have.property('proporcionPreferente');
      });
    language: text/javascript
order: 34000