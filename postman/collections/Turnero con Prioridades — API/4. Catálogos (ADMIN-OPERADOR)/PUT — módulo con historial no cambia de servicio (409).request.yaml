$kind: http-request
description: |-
  El módulo 3 de la semilla tiene turnos asociados (LLAMADO/EN_ATENCION y terminales):
  cambiar su servicioId rompería la trazabilidad histórica y responde 409.
url: "{{baseUrl}}/api/v1/modulos/3"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: '{"servicioId":1,"nombre":"Modulo Asesoria 1","activo":true}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 Conflict', () => pm.response.to.have.status(409));
      const r = pm.response.json();
      pm.test('mensaje de historial', () => pm.expect(r.mensaje).to.include('turnos asociados'));
    language: text/javascript
order: 16000