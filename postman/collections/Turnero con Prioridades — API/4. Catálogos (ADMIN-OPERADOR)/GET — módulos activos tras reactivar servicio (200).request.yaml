$kind: http-request
description: |-
  Tras reactivar el servicio, sus módulos siguen inactivos: activo=true no devuelve ninguno.
url: "{{baseUrl}}/api/v1/modulos?servicioId={{servicioCreadoId}}&activo=true"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test('no hay módulos activos todavía', () => pm.expect(r.length).to.eql(0));
    language: text/javascript
order: 23000