$kind: http-request
description: |-
  Con el servicio padre activo, el módulo puede reactivarse individualmente.
url: "{{baseUrl}}/api/v1/modulos/{{moduloCreadoId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: '{"servicioId":{{servicioCreadoId}},"nombre":"{{moduloNombre}} Principal","activo":true}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test('reactivado y libre', () => {
        pm.expect(r.activo).to.eql(true);
        pm.expect(r.ocupado).to.eql(false);
      });
    language: text/javascript
order: 24000