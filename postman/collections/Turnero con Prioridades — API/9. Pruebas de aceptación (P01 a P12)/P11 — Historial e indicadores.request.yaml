$kind: http-request
name: P11 — Historial e indicadores
description: |-
  Criterio: filtros, transiciones y conteos coinciden con los datos; el promedio de espera es fecha_inicio_atencion menos fecha_ingreso de los turnos con inicio registrado.
  El script previo deja 5 turnos en un servicio nuevo: 1 FINALIZADO, 1 AUSENTE, 1 CANCELADO, 1 EN_ATENCION y 1 EN_ESPERA. La petición pide los indicadores del servicio y el script posterior los compara con el detalle de cada turno.
url: "{{baseUrl}}/api/v1/turnos/indicadores?servicioId={{accServicioId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: beforeRequest
    code: |-
      // Utilidades del caso
      const base = pm.variables.replaceIn('{{baseUrl}}') + '/api/v1';
      const admin = pm.collectionVariables.get('token');
      const opA = pm.collectionVariables.get('accTokenA');
      const opB = pm.collectionVariables.get('accTokenB');
      async function api(metodo, ruta, token, cuerpo) {
        const peticion = { url: base + ruta, method: metodo, header: {} };
        if (token) peticion.header.Authorization = 'Bearer ' + token;
        if (cuerpo !== undefined) {
          peticion.header['Content-Type'] = 'application/json';
          peticion.body = { mode: 'raw', raw: typeof cuerpo === 'string' ? cuerpo : JSON.stringify(cuerpo) };
        }
        const r = await pm.sendRequest(peticion);
        let json = null;
        try { json = r.json(); } catch (e) { json = null; }
        return { status: r.code, json };
      }
      function letras(n) {
        let texto = '';
        for (let i = 0; i < n; i++) texto += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(Math.floor(Math.random() * 26));
        return texto;
      }
      async function crearServicio(prefijo) {
        const s = await api('POST', '/servicios', admin, { codigoPrefijo: prefijo + letras(4), nombre: 'Aceptacion ' + prefijo + ' ' + Date.now(), descripcion: 'Prueba de aceptación' });
        const m = await api('POST', '/modulos', admin, { servicioId: s.json.id, nombre: 'Ventanilla ' + s.json.codigoPrefijo });
        return { id: s.json.id, prefijo: s.json.codigoPrefijo, moduloId: m.json.id };
      }
      async function crearModulo(servicioId, nombre) {
        return (await api('POST', '/modulos', admin, { servicioId, nombre: nombre + ' ' + Date.now() })).json.id;
      }
      async function emitir(servicioId, categoriaId, token) {
        const cliente = 'CC ' + Math.floor(1000000 + Math.random() * 9000000) + ' - Prueba';
        return (await api('POST', '/turnos', token || opA, { identificadorCliente: cliente, servicioId, categoriaId })).json;
      }
      function llamar(moduloId, token) {
        return api('POST', '/modulos/' + moduloId + '/siguiente', token || opA);
      }
      function cambiar(id, nuevoEstado, token, motivo) {
        return api('PATCH', '/turnos/' + id + '/estado', token || opA, motivo === undefined ? { nuevoEstado } : { nuevoEstado, motivo });
      }
      function liberar(id, token) {
        return cambiar(id, 'CANCELADO', token, 'Liberado para el siguiente llamado');
      }
      async function contador(servicioId) {
        return (await api('GET', '/parametros-cola', admin)).json.find(e => e.servicioId === servicioId).contadorPreferentes;
      }
      const esperar = (ms) => new Promise(resolver => setTimeout(resolver, ms));
      const caso = () => JSON.parse(pm.collectionVariables.get('accCaso'));

      const s = await crearServicio('HIS');
      const ids = [];
      for (let i = 0; i < 5; i++) ids.push((await emitir(s.id, 4)).id);
      await esperar(1500);
      let r = await llamar(s.moduloId);
      await esperar(1000);
      await cambiar(r.json.turno.id, 'EN_ATENCION');
      await cambiar(r.json.turno.id, 'FINALIZADO');
      r = await llamar(s.moduloId);
      await cambiar(r.json.turno.id, 'AUSENTE', opA, 'El cliente no se presentó');
      await cambiar(ids[4], 'CANCELADO', opA, 'El cliente se retiró de la fila');
      r = await llamar(s.moduloId);
      await cambiar(r.json.turno.id, 'EN_ATENCION');
      pm.collectionVariables.set('accServicioId', String(s.id));
      pm.collectionVariables.set('accCaso', JSON.stringify({ servicioId: s.id, ids, enAtencion: r.json.turno.id }));
    language: text/javascript
  - type: afterResponse
    code: |-
      // Utilidades del caso
      const base = pm.variables.replaceIn('{{baseUrl}}') + '/api/v1';
      const admin = pm.collectionVariables.get('token');
      const opA = pm.collectionVariables.get('accTokenA');
      const opB = pm.collectionVariables.get('accTokenB');
      async function api(metodo, ruta, token, cuerpo) {
        const peticion = { url: base + ruta, method: metodo, header: {} };
        if (token) peticion.header.Authorization = 'Bearer ' + token;
        if (cuerpo !== undefined) {
          peticion.header['Content-Type'] = 'application/json';
          peticion.body = { mode: 'raw', raw: typeof cuerpo === 'string' ? cuerpo : JSON.stringify(cuerpo) };
        }
        const r = await pm.sendRequest(peticion);
        let json = null;
        try { json = r.json(); } catch (e) { json = null; }
        return { status: r.code, json };
      }
      function letras(n) {
        let texto = '';
        for (let i = 0; i < n; i++) texto += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(Math.floor(Math.random() * 26));
        return texto;
      }
      async function crearServicio(prefijo) {
        const s = await api('POST', '/servicios', admin, { codigoPrefijo: prefijo + letras(4), nombre: 'Aceptacion ' + prefijo + ' ' + Date.now(), descripcion: 'Prueba de aceptación' });
        const m = await api('POST', '/modulos', admin, { servicioId: s.json.id, nombre: 'Ventanilla ' + s.json.codigoPrefijo });
        return { id: s.json.id, prefijo: s.json.codigoPrefijo, moduloId: m.json.id };
      }
      async function crearModulo(servicioId, nombre) {
        return (await api('POST', '/modulos', admin, { servicioId, nombre: nombre + ' ' + Date.now() })).json.id;
      }
      async function emitir(servicioId, categoriaId, token) {
        const cliente = 'CC ' + Math.floor(1000000 + Math.random() * 9000000) + ' - Prueba';
        return (await api('POST', '/turnos', token || opA, { identificadorCliente: cliente, servicioId, categoriaId })).json;
      }
      function llamar(moduloId, token) {
        return api('POST', '/modulos/' + moduloId + '/siguiente', token || opA);
      }
      function cambiar(id, nuevoEstado, token, motivo) {
        return api('PATCH', '/turnos/' + id + '/estado', token || opA, motivo === undefined ? { nuevoEstado } : { nuevoEstado, motivo });
      }
      function liberar(id, token) {
        return cambiar(id, 'CANCELADO', token, 'Liberado para el siguiente llamado');
      }
      async function contador(servicioId) {
        return (await api('GET', '/parametros-cola', admin)).json.find(e => e.servicioId === servicioId).contadorPreferentes;
      }
      const esperar = (ms) => new Promise(resolver => setTimeout(resolver, ms));
      const caso = () => JSON.parse(pm.collectionVariables.get('accCaso'));

      pm.test('200 OK', () => pm.response.to.have.status(200));
      const ind = pm.response.json();
      const c = caso();
      const detalles = [];
      for (const id of c.ids) detalles.push((await api('GET', '/turnos/' + id, admin)).json);
      const cuantos = (...estados) => detalles.filter(d => estados.includes(d.estado)).length;
      pm.test('conteos iguales a los turnos del servicio', () => {
        pm.expect(ind.totalEmitidos).to.eql(detalles.length);
        pm.expect(ind.totalFinalizados).to.eql(cuantos('FINALIZADO'));
        pm.expect(ind.totalCancelados).to.eql(cuantos('CANCELADO'));
        pm.expect(ind.totalAusentes).to.eql(cuantos('AUSENTE'));
        pm.expect(ind.totalEnEspera).to.eql(cuantos('EN_ESPERA'));
        pm.expect(ind.totalEnAtencionOLlamado).to.eql(cuantos('LLAMADO', 'EN_ATENCION'));
        pm.expect([ind.totalEmitidos, ind.totalFinalizados, ind.totalCancelados, ind.totalAusentes, ind.totalEnEspera, ind.totalEnAtencionOLlamado]).to.eql([5, 1, 1, 1, 1, 1]);
      });
      const atendidos = detalles.filter(d => d.fechaInicioAtencion);
      const esperado = atendidos.reduce((suma, d) => suma + (new Date(d.fechaInicioAtencion) - new Date(d.fechaIngreso)) / 1000, 0) / atendidos.length;
      pm.test('promedio de espera = inicio de atención menos ingreso de los 2 turnos atendidos', () => {
        pm.expect(atendidos.length).to.eql(2);
        pm.expect(ind.tiempoPromedioEsperaSegundos).to.be.closeTo(esperado, 0.5);
      });
      const fecha = detalles[0].fechaOperacion;
      const todos = (await api('GET', '/turnos?modo=HISTORIAL&servicioId=' + c.servicioId, admin)).json;
      const ausentes = (await api('GET', '/turnos?modo=HISTORIAL&servicioId=' + c.servicioId + '&estado=AUSENTE', admin)).json;
      const delDia = (await api('GET', '/turnos?modo=HISTORIAL&servicioId=' + c.servicioId + '&fecha=' + fecha, admin)).json;
      pm.test('filtros del historial por servicio, estado y fecha', () => {
        pm.expect(todos.map(t => t.id).sort((a, b) => a - b)).to.eql([...c.ids].sort((a, b) => a - b));
        pm.expect(ausentes.map(t => t.id)).to.eql(detalles.filter(d => d.estado === 'AUSENTE').map(d => d.id));
        pm.expect(delDia.length).to.eql(5);
      });
      const finalizado = detalles.find(d => d.estado === 'FINALIZADO');
      pm.test('transiciones del turno finalizado en orden', () => {
        pm.expect(finalizado.transiciones.map(t => t.estadoNuevo)).to.eql(['EN_ESPERA', 'LLAMADO', 'EN_ATENCION', 'FINALIZADO']);
      });
      await cambiar(c.enAtencion, 'FINALIZADO');
    language: text/javascript
order: 12000
