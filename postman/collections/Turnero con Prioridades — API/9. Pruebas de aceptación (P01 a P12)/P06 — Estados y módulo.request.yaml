$kind: http-request
name: P06 — Estados y módulo
description: |-
  Criterio: rechazar finalizar desde EN_ESPERA y repetir una finalización; rechazar llamar con el módulo ocupado o con la cuenta ya ocupada en otro módulo o servicio; rechazar a un OPERADOR que modifica el turno activo de otro o cancela un EN_ESPERA de días anteriores; permitir al ADMIN resolverlo, quedando en el historial sin reemplazar al operador asignado.
  La petición intenta finalizar un turno EN_ESPERA (409). Los turnos de días anteriores no se pueden crear por API: si la base no tiene ninguno en espera, esa aserción queda omitida.
url: "{{baseUrl}}/api/v1/turnos/{{accTurnoId}}/estado"
method: PATCH
headers:
  Authorization: Bearer {{accTokenA}}
  Content-Type: application/json
body:
  type: text
  content: '{"nuevoEstado":"FINALIZADO"}'
scripts:
  - type: beforeRequest
    code: |-
      // Utilidades del caso
      const base = pm.variables.replaceIn('{{baseUrl}}') + '/api/v1';
      const admin = pm.collectionVariables.get('token');
      const opA = pm.collectionVariables.get('accTokenA');
      const opB = pm.collectionVariables.get('accTokenB');
      async function api(metodo, ruta, token, cuerpo) {
        const peticion = { url: base + ruta, method: metodo, header: {} };
        if (token) peticion.header.Authorization = 'Bearer ' + token;
        if (cuerpo !== undefined) {
          peticion.header['Content-Type'] = 'application/json';
          peticion.body = { mode: 'raw', raw: typeof cuerpo === 'string' ? cuerpo : JSON.stringify(cuerpo) };
        }
        const r = await pm.sendRequest(peticion);
        let json = null;
        try { json = r.json(); } catch (e) { json = null; }
        return { status: r.code, json };
      }
      function letras(n) {
        let texto = '';
        for (let i = 0; i < n; i++) texto += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(Math.floor(Math.random() * 26));
        return texto;
      }
      async function crearServicio(prefijo) {
        const s = await api('POST', '/servicios', admin, { codigoPrefijo: prefijo + letras(4), nombre: 'Aceptacion ' + prefijo + ' ' + Date.now(), descripcion: 'Prueba de aceptación' });
        const m = await api('POST', '/modulos', admin, { servicioId: s.json.id, nombre: 'Ventanilla ' + s.json.codigoPrefijo });
        return { id: s.json.id, prefijo: s.json.codigoPrefijo, moduloId: m.json.id };
      }
      async function crearModulo(servicioId, nombre) {
        return (await api('POST', '/modulos', admin, { servicioId, nombre: nombre + ' ' + Date.now() })).json.id;
      }
      async function emitir(servicioId, categoriaId, token) {
        const cliente = 'CC ' + Math.floor(1000000 + Math.random() * 9000000) + ' - Prueba';
        return (await api('POST', '/turnos', token || opA, { identificadorCliente: cliente, servicioId, categoriaId })).json;
      }
      function llamar(moduloId, token) {
        return api('POST', '/modulos/' + moduloId + '/siguiente', token || opA);
      }
      function cambiar(id, nuevoEstado, token, motivo) {
        return api('PATCH', '/turnos/' + id + '/estado', token || opA, motivo === undefined ? { nuevoEstado } : { nuevoEstado, motivo });
      }
      function liberar(id, token) {
        return cambiar(id, 'CANCELADO', token, 'Liberado para el siguiente llamado');
      }
      async function contador(servicioId) {
        return (await api('GET', '/parametros-cola', admin)).json.find(e => e.servicioId === servicioId).contadorPreferentes;
      }
      const esperar = (ms) => new Promise(resolver => setTimeout(resolver, ms));
      const caso = () => JSON.parse(pm.collectionVariables.get('accCaso'));

      const s = await crearServicio('EST');
      const m2 = await crearModulo(s.id, 'Segunda ' + s.prefijo);
      const otro = await crearServicio('ESB');
      const t1 = await emitir(s.id, 4);
      const t2 = await emitir(s.id, 4);
      const t3 = await emitir(otro.id, 4);
      pm.collectionVariables.set('accTurnoId', String(t1.id));
      pm.collectionVariables.set('accCaso', JSON.stringify({ moduloId: s.moduloId, m2, otroModuloId: otro.moduloId, t1: t1.id, t2: t2.id, t3: t3.id }));
    language: text/javascript
  - type: afterResponse
    code: |-
      // Utilidades del caso
      const base = pm.variables.replaceIn('{{baseUrl}}') + '/api/v1';
      const admin = pm.collectionVariables.get('token');
      const opA = pm.collectionVariables.get('accTokenA');
      const opB = pm.collectionVariables.get('accTokenB');
      async function api(metodo, ruta, token, cuerpo) {
        const peticion = { url: base + ruta, method: metodo, header: {} };
        if (token) peticion.header.Authorization = 'Bearer ' + token;
        if (cuerpo !== undefined) {
          peticion.header['Content-Type'] = 'application/json';
          peticion.body = { mode: 'raw', raw: typeof cuerpo === 'string' ? cuerpo : JSON.stringify(cuerpo) };
        }
        const r = await pm.sendRequest(peticion);
        let json = null;
        try { json = r.json(); } catch (e) { json = null; }
        return { status: r.code, json };
      }
      function letras(n) {
        let texto = '';
        for (let i = 0; i < n; i++) texto += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(Math.floor(Math.random() * 26));
        return texto;
      }
      async function crearServicio(prefijo) {
        const s = await api('POST', '/servicios', admin, { codigoPrefijo: prefijo + letras(4), nombre: 'Aceptacion ' + prefijo + ' ' + Date.now(), descripcion: 'Prueba de aceptación' });
        const m = await api('POST', '/modulos', admin, { servicioId: s.json.id, nombre: 'Ventanilla ' + s.json.codigoPrefijo });
        return { id: s.json.id, prefijo: s.json.codigoPrefijo, moduloId: m.json.id };
      }
      async function crearModulo(servicioId, nombre) {
        return (await api('POST', '/modulos', admin, { servicioId, nombre: nombre + ' ' + Date.now() })).json.id;
      }
      async function emitir(servicioId, categoriaId, token) {
        const cliente = 'CC ' + Math.floor(1000000 + Math.random() * 9000000) + ' - Prueba';
        return (await api('POST', '/turnos', token || opA, { identificadorCliente: cliente, servicioId, categoriaId })).json;
      }
      function llamar(moduloId, token) {
        return api('POST', '/modulos/' + moduloId + '/siguiente', token || opA);
      }
      function cambiar(id, nuevoEstado, token, motivo) {
        return api('PATCH', '/turnos/' + id + '/estado', token || opA, motivo === undefined ? { nuevoEstado } : { nuevoEstado, motivo });
      }
      function liberar(id, token) {
        return cambiar(id, 'CANCELADO', token, 'Liberado para el siguiente llamado');
      }
      async function contador(servicioId) {
        return (await api('GET', '/parametros-cola', admin)).json.find(e => e.servicioId === servicioId).contadorPreferentes;
      }
      const esperar = (ms) => new Promise(resolver => setTimeout(resolver, ms));
      const caso = () => JSON.parse(pm.collectionVariables.get('accCaso'));

      pm.test('finalizar desde EN_ESPERA: 409', () => pm.response.to.have.status(409));
      const c = caso();
      const llamado = await llamar(c.moduloId, opA);
      const ocupado = await llamar(c.moduloId, opB);
      pm.test('otra cuenta llama en el módulo ocupado: 409', () => {
        pm.expect(llamado.status).to.eql(200);
        pm.expect(ocupado.status).to.eql(409);
      });
      const mismoServicio = await llamar(c.m2, opA);
      const otroServicio = await llamar(c.otroModuloId, opA);
      pm.test('la cuenta con turno activo no llama en otro módulo ni en otro servicio: 409', () => pm.expect([mismoServicio.status, otroServicio.status]).to.eql([409, 409]));
      const ajeno = await cambiar(c.t1, 'EN_ATENCION', opB);
      pm.test('un OPERADOR modifica el turno activo de otro: 403', () => pm.expect(ajeno.status).to.eql(403));
      await cambiar(c.t1, 'EN_ATENCION', opA);
      const fin = await cambiar(c.t1, 'FINALIZADO', opA);
      const repetido = await cambiar(c.t1, 'FINALIZADO', opA);
      pm.test('finalizar 200 y repetir la finalización 409', () => pm.expect([fin.status, repetido.status]).to.eql([200, 409]));
      const segundo = await llamar(c.moduloId, opA);
      const porAdmin = await cambiar(c.t2, 'AUSENTE', admin, 'Resuelto por el administrador');
      const detalle = (await api('GET', '/turnos/' + c.t2, admin)).json;
      pm.test('el ADMIN resuelve el turno ajeno: queda en el historial y el operador asignado no cambia', () => {
        pm.expect(segundo.json.turno.id).to.eql(c.t2);
        pm.expect(porAdmin.status).to.eql(200);
        pm.expect(detalle.operadorUsername).to.eql(pm.collectionVariables.get('accUsernameA'));
        pm.expect(detalle.transiciones[detalle.transiciones.length - 1].operadorUsername).to.eql('admin');
      });
      await liberar(c.t3);
      const hoy = detalle.fechaOperacion;
      const anteriores = (await api('GET', '/turnos?modo=HISTORIAL&estado=EN_ESPERA', admin)).json.filter(t => t.fechaOperacion < hoy);
      if (anteriores.length > 0) {
        const operador = await cambiar(anteriores[0].id, 'CANCELADO', opB, 'Cierre de turnos de días anteriores');
        const administrador = await cambiar(anteriores[0].id, 'CANCELADO', admin, 'Cierre de turnos de días anteriores');
        pm.test('EN_ESPERA de un día anterior: 403 para el OPERADOR y 200 para el ADMIN', () => pm.expect([operador.status, administrador.status]).to.eql([403, 200]));
      } else {
        pm.test.skip('EN_ESPERA de un día anterior: 403 para el OPERADOR y 200 para el ADMIN (no hay turnos en espera de días anteriores)', () => {});
      }
    language: text/javascript
order: 7000
