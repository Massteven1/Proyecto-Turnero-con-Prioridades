$kind: http-request
name: P07 — Validaciones
description: |-
  Criterio: rechazar campos vacíos, referencias inexistentes, consecutivos, estados o fechas enviados por el cliente y datos fuera de longitud; rechazar CANCELADO o AUSENTE sin motivo de 5 a 255 caracteres y un password vacío al actualizar un usuario (null u omitido conserva el actual).
  La petición registra un turno con identificadorCliente vacío (400). El script posterior envía el resto de los casos.
url: "{{baseUrl}}/api/v1/turnos"
method: POST
headers:
  Authorization: Bearer {{accTokenA}}
  Content-Type: application/json
body:
  type: text
  content: '{"identificadorCliente":"","servicioId":{{accServicioId}},"categoriaId":4}'
scripts:
  - type: beforeRequest
    code: |-
      // Utilidades del caso
      const base = pm.variables.replaceIn('{{baseUrl}}') + '/api/v1';
      const admin = pm.collectionVariables.get('token');
      const opA = pm.collectionVariables.get('accTokenA');
      const opB = pm.collectionVariables.get('accTokenB');
      async function api(metodo, ruta, token, cuerpo) {
        const peticion = { url: base + ruta, method: metodo, header: {} };
        if (token) peticion.header.Authorization = 'Bearer ' + token;
        if (cuerpo !== undefined) {
          peticion.header['Content-Type'] = 'application/json';
          peticion.body = { mode: 'raw', raw: typeof cuerpo === 'string' ? cuerpo : JSON.stringify(cuerpo) };
        }
        const r = await pm.sendRequest(peticion);
        let json = null;
        try { json = r.json(); } catch (e) { json = null; }
        return { status: r.code, json };
      }
      function letras(n) {
        let texto = '';
        for (let i = 0; i < n; i++) texto += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(Math.floor(Math.random() * 26));
        return texto;
      }
      async function crearServicio(prefijo) {
        const s = await api('POST', '/servicios', admin, { codigoPrefijo: prefijo + letras(4), nombre: 'Aceptacion ' + prefijo + ' ' + Date.now(), descripcion: 'Prueba de aceptación' });
        const m = await api('POST', '/modulos', admin, { servicioId: s.json.id, nombre: 'Ventanilla ' + s.json.codigoPrefijo });
        return { id: s.json.id, prefijo: s.json.codigoPrefijo, moduloId: m.json.id };
      }
      async function crearModulo(servicioId, nombre) {
        return (await api('POST', '/modulos', admin, { servicioId, nombre: nombre + ' ' + Date.now() })).json.id;
      }
      async function emitir(servicioId, categoriaId, token) {
        const cliente = 'CC ' + Math.floor(1000000 + Math.random() * 9000000) + ' - Prueba';
        return (await api('POST', '/turnos', token || opA, { identificadorCliente: cliente, servicioId, categoriaId })).json;
      }
      function llamar(moduloId, token) {
        return api('POST', '/modulos/' + moduloId + '/siguiente', token || opA);
      }
      function cambiar(id, nuevoEstado, token, motivo) {
        return api('PATCH', '/turnos/' + id + '/estado', token || opA, motivo === undefined ? { nuevoEstado } : { nuevoEstado, motivo });
      }
      function liberar(id, token) {
        return cambiar(id, 'CANCELADO', token, 'Liberado para el siguiente llamado');
      }
      async function contador(servicioId) {
        return (await api('GET', '/parametros-cola', admin)).json.find(e => e.servicioId === servicioId).contadorPreferentes;
      }
      const esperar = (ms) => new Promise(resolver => setTimeout(resolver, ms));
      const caso = () => JSON.parse(pm.collectionVariables.get('accCaso'));

      const s = await crearServicio('VAL');
      pm.collectionVariables.set('accServicioId', String(s.id));
      pm.collectionVariables.set('accModuloId', String(s.moduloId));
    language: text/javascript
  - type: afterResponse
    code: |-
      // Utilidades del caso
      const base = pm.variables.replaceIn('{{baseUrl}}') + '/api/v1';
      const admin = pm.collectionVariables.get('token');
      const opA = pm.collectionVariables.get('accTokenA');
      const opB = pm.collectionVariables.get('accTokenB');
      async function api(metodo, ruta, token, cuerpo) {
        const peticion = { url: base + ruta, method: metodo, header: {} };
        if (token) peticion.header.Authorization = 'Bearer ' + token;
        if (cuerpo !== undefined) {
          peticion.header['Content-Type'] = 'application/json';
          peticion.body = { mode: 'raw', raw: typeof cuerpo === 'string' ? cuerpo : JSON.stringify(cuerpo) };
        }
        const r = await pm.sendRequest(peticion);
        let json = null;
        try { json = r.json(); } catch (e) { json = null; }
        return { status: r.code, json };
      }
      function letras(n) {
        let texto = '';
        for (let i = 0; i < n; i++) texto += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(Math.floor(Math.random() * 26));
        return texto;
      }
      async function crearServicio(prefijo) {
        const s = await api('POST', '/servicios', admin, { codigoPrefijo: prefijo + letras(4), nombre: 'Aceptacion ' + prefijo + ' ' + Date.now(), descripcion: 'Prueba de aceptación' });
        const m = await api('POST', '/modulos', admin, { servicioId: s.json.id, nombre: 'Ventanilla ' + s.json.codigoPrefijo });
        return { id: s.json.id, prefijo: s.json.codigoPrefijo, moduloId: m.json.id };
      }
      async function crearModulo(servicioId, nombre) {
        return (await api('POST', '/modulos', admin, { servicioId, nombre: nombre + ' ' + Date.now() })).json.id;
      }
      async function emitir(servicioId, categoriaId, token) {
        const cliente = 'CC ' + Math.floor(1000000 + Math.random() * 9000000) + ' - Prueba';
        return (await api('POST', '/turnos', token || opA, { identificadorCliente: cliente, servicioId, categoriaId })).json;
      }
      function llamar(moduloId, token) {
        return api('POST', '/modulos/' + moduloId + '/siguiente', token || opA);
      }
      function cambiar(id, nuevoEstado, token, motivo) {
        return api('PATCH', '/turnos/' + id + '/estado', token || opA, motivo === undefined ? { nuevoEstado } : { nuevoEstado, motivo });
      }
      function liberar(id, token) {
        return cambiar(id, 'CANCELADO', token, 'Liberado para el siguiente llamado');
      }
      async function contador(servicioId) {
        return (await api('GET', '/parametros-cola', admin)).json.find(e => e.servicioId === servicioId).contadorPreferentes;
      }
      const esperar = (ms) => new Promise(resolver => setTimeout(resolver, ms));
      const caso = () => JSON.parse(pm.collectionVariables.get('accCaso'));

      pm.test('identificadorCliente vacío: 400 con el detalle del campo', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().detallesValidacion).to.have.property('identificadorCliente');
      });
      const sid = Number(pm.collectionVariables.get('accServicioId'));
      const casos = [
        ['sin servicioId ni categoriaId', 400, () => api('POST', '/turnos', opA, { identificadorCliente: 'CC 7000001' })],
        ['identificador de 2 caracteres', 400, () => api('POST', '/turnos', opA, { identificadorCliente: 'ab', servicioId: sid, categoriaId: 4 })],
        ['identificador de 101 caracteres', 400, () => api('POST', '/turnos', opA, { identificadorCliente: 'x'.repeat(101), servicioId: sid, categoriaId: 4 })],
        ['servicio inexistente', 404, () => api('POST', '/turnos', opA, { identificadorCliente: 'CC 7000002', servicioId: 999999, categoriaId: 4 })],
        ['categoría inexistente', 404, () => api('POST', '/turnos', opA, { identificadorCliente: 'CC 7000003', servicioId: sid, categoriaId: 999999 })],
        ['módulo de un servicio inexistente', 404, () => api('POST', '/modulos', admin, { servicioId: 999999, nombre: 'Modulo fantasma' })],
        ['JSON mal formado', 400, () => api('POST', '/turnos', opA, '{"identificadorCliente": ')],
        ['username de 2 caracteres', 400, () => api('POST', '/usuarios', admin, { username: 'ab', nombreCompleto: 'Nombre valido', password: 'Valida123*', rol: 'OPERADOR' })],
        ['password de 7 caracteres', 400, () => api('POST', '/usuarios', admin, { username: 'acc_corta_' + Date.now(), nombreCompleto: 'Nombre valido', password: 'Corta1*', rol: 'OPERADOR' })],
        ['prefijo en minúsculas y dígitos', 400, () => api('POST', '/servicios', admin, { codigoPrefijo: 'ab1', nombre: 'Servicio invalido', descripcion: '' })],
        ['parámetros de cola fuera de rango', 400, () => api('PUT', '/parametros-cola/' + sid, admin, { umbralEnvejecimientoMin: 0, proporcionPreferente: 11 })]
      ];
      for (const [nombre, esperado, ejecutar] of casos) {
        const r = await ejecutar();
        pm.test(nombre + ': ' + esperado, () => pm.expect(r.status).to.eql(esperado));
      }
      const forzado = await api('POST', '/turnos', opA, {
        identificadorCliente: 'CC 7000004 - Campos', servicioId: sid, categoriaId: 4,
        consecutivo: 999, codigo: 'VALI-20200101-999', estado: 'FINALIZADO',
        fechaOperacion: '2020-01-01', fechaIngreso: '2020-01-01T08:00:00', fechaLlamado: '2020-01-01T08:05:00'
      });
      pm.test('consecutivo, estado y fechas enviados por el cliente se ignoran', () => {
        pm.expect(forzado.status).to.eql(201);
        pm.expect(forzado.json.consecutivo).to.eql(1);
        pm.expect(forzado.json.estado).to.eql('EN_ESPERA');
        pm.expect(forzado.json.fechaOperacion).to.not.eql('2020-01-01');
        pm.expect(forzado.json.fechaLlamado).to.eql(null);
      });
      const id = (await llamar(Number(pm.collectionVariables.get('accModuloId')))).json.turno.id;
      const motivos = [
        ['CANCELADO sin motivo', 'CANCELADO', undefined],
        ['AUSENTE sin motivo', 'AUSENTE', undefined],
        ['motivo de 4 caracteres', 'CANCELADO', 'Nada'],
        ['motivo de solo espacios', 'AUSENTE', '        '],
        ['motivo de 256 caracteres', 'CANCELADO', 'm'.repeat(256)]
      ];
      for (const [nombre, destino, motivo] of motivos) {
        const r = await cambiar(id, destino, opA, motivo);
        pm.test(nombre + ': 400', () => pm.expect(r.status).to.eql(400));
      }
      const valido = await cambiar(id, 'AUSENTE', opA, 'Ausen');
      pm.test('AUSENTE con motivo de 5 caracteres: 200', () => pm.expect(valido.status).to.eql(200));
      const idB = pm.collectionVariables.get('accIdB');
      const nombreB = pm.collectionVariables.get('accNombreB');
      const vacio = await api('PUT', '/usuarios/' + idB, admin, { nombreCompleto: nombreB, password: '', rol: 'OPERADOR', activo: true });
      const nulo = await api('PUT', '/usuarios/' + idB, admin, { nombreCompleto: nombreB, password: null, rol: 'OPERADOR', activo: true });
      const omitido = await api('PUT', '/usuarios/' + idB, admin, { nombreCompleto: nombreB, rol: 'OPERADOR', activo: true });
      const login = await api('POST', '/auth/login', null, { username: pm.collectionVariables.get('accUsernameB'), password: 'Aceptacion123*' });
      pm.test('password vacío al actualizar: 400; null u omitido: 200 y la contraseña sigue igual', () => {
        pm.expect([vacio.status, nulo.status, omitido.status, login.status]).to.eql([400, 200, 200, 200]);
      });
    language: text/javascript
order: 8000
