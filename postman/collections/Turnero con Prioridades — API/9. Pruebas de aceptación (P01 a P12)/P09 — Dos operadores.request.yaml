$kind: http-request
name: P09 — Dos operadores
description: |-
  Criterio: dos operadores que llaman a la vez sobre una misma cola reciben turnos distintos; si queda uno solo, solo una solicitud lo obtiene; una misma cuenta que llama a la vez en módulos de dos servicios obtiene un solo turno activo.
  El script previo envía las solicitudes en paralelo, 5 rondas por escenario. La petición revisa el historial del servicio.
url: "{{baseUrl}}/api/v1/turnos?modo=HISTORIAL&servicioId={{accServicioId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: beforeRequest
    code: |-
      // Utilidades del caso
      const base = pm.variables.replaceIn('{{baseUrl}}') + '/api/v1';
      const admin = pm.collectionVariables.get('token');
      const opA = pm.collectionVariables.get('accTokenA');
      const opB = pm.collectionVariables.get('accTokenB');
      async function api(metodo, ruta, token, cuerpo) {
        const peticion = { url: base + ruta, method: metodo, header: {} };
        if (token) peticion.header.Authorization = 'Bearer ' + token;
        if (cuerpo !== undefined) {
          peticion.header['Content-Type'] = 'application/json';
          peticion.body = { mode: 'raw', raw: typeof cuerpo === 'string' ? cuerpo : JSON.stringify(cuerpo) };
        }
        const r = await pm.sendRequest(peticion);
        let json = null;
        try { json = r.json(); } catch (e) { json = null; }
        return { status: r.code, json };
      }
      function letras(n) {
        let texto = '';
        for (let i = 0; i < n; i++) texto += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(Math.floor(Math.random() * 26));
        return texto;
      }
      async function crearServicio(prefijo) {
        const s = await api('POST', '/servicios', admin, { codigoPrefijo: prefijo + letras(4), nombre: 'Aceptacion ' + prefijo + ' ' + Date.now(), descripcion: 'Prueba de aceptación' });
        const m = await api('POST', '/modulos', admin, { servicioId: s.json.id, nombre: 'Ventanilla ' + s.json.codigoPrefijo });
        return { id: s.json.id, prefijo: s.json.codigoPrefijo, moduloId: m.json.id };
      }
      async function crearModulo(servicioId, nombre) {
        return (await api('POST', '/modulos', admin, { servicioId, nombre: nombre + ' ' + Date.now() })).json.id;
      }
      async function emitir(servicioId, categoriaId, token) {
        const cliente = 'CC ' + Math.floor(1000000 + Math.random() * 9000000) + ' - Prueba';
        return (await api('POST', '/turnos', token || opA, { identificadorCliente: cliente, servicioId, categoriaId })).json;
      }
      function llamar(moduloId, token) {
        return api('POST', '/modulos/' + moduloId + '/siguiente', token || opA);
      }
      function cambiar(id, nuevoEstado, token, motivo) {
        return api('PATCH', '/turnos/' + id + '/estado', token || opA, motivo === undefined ? { nuevoEstado } : { nuevoEstado, motivo });
      }
      function liberar(id, token) {
        return cambiar(id, 'CANCELADO', token, 'Liberado para el siguiente llamado');
      }
      async function contador(servicioId) {
        return (await api('GET', '/parametros-cola', admin)).json.find(e => e.servicioId === servicioId).contadorPreferentes;
      }
      const esperar = (ms) => new Promise(resolver => setTimeout(resolver, ms));
      const caso = () => JSON.parse(pm.collectionVariables.get('accCaso'));

      const s = await crearServicio('CON');
      const m2 = await crearModulo(s.id, 'Segunda ' + s.prefijo);
      const otro = await crearServicio('COB');
      const RONDAS = 5;
      const llamados = [];
      const tieneTurno = (r) => r.status === 200 && r.json.turno !== null;
      let distintos = 0;
      for (let i = 0; i < RONDAS; i++) {
        await emitir(s.id, 4);
        await emitir(s.id, 1);
        const [x, y] = await Promise.all([llamar(s.moduloId, opA), llamar(m2, opB)]);
        if (tieneTurno(x) && tieneTurno(y) && x.json.turno.id !== y.json.turno.id) distintos++;
        for (const [r, token] of [[x, opA], [y, opB]]) {
          if (tieneTurno(r)) { llamados.push(r.json.turno.id); await liberar(r.json.turno.id, token); }
        }
      }
      pm.test('dos turnos y dos operadores a la vez: turnos distintos en ' + distintos + ' de ' + RONDAS + ' rondas', () => pm.expect(distintos).to.eql(RONDAS));
      let unaSola = 0;
      for (let i = 0; i < RONDAS; i++) {
        await emitir(s.id, 4);
        const [x, y] = await Promise.all([llamar(s.moduloId, opA), llamar(m2, opB)]);
        const ganadores = [[x, opA], [y, opB]].filter(([r]) => tieneTurno(r));
        const vacia = [x, y].some(r => r.status === 200 && r.json.colaVacia === true);
        if (ganadores.length === 1 && vacia) unaSola++;
        for (const [r, token] of ganadores) { llamados.push(r.json.turno.id); await liberar(r.json.turno.id, token); }
      }
      pm.test('un solo turno: una solicitud lo obtiene y la otra recibe colaVacia en ' + unaSola + ' de ' + RONDAS + ' rondas', () => pm.expect(unaSola).to.eql(RONDAS));
      let unaCuenta = 0;
      for (let i = 0; i < RONDAS; i++) {
        await emitir(s.id, 4);
        await emitir(otro.id, 4);
        const [x, y] = await Promise.all([llamar(s.moduloId, opA), llamar(otro.moduloId, opA)]);
        const ganadores = [x, y].filter(tieneTurno);
        if (ganadores.length === 1 && [x.status, y.status].includes(409)) unaCuenta++;
        for (const r of ganadores) { llamados.push(r.json.turno.id); await liberar(r.json.turno.id); }
      }
      pm.test('misma cuenta en dos servicios a la vez: un solo turno activo en ' + unaCuenta + ' de ' + RONDAS + ' rondas', () => pm.expect(unaCuenta).to.eql(RONDAS));
      pm.collectionVariables.set('accServicioId', String(s.id));
      pm.collectionVariables.set('accCaso', JSON.stringify({ llamados }));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const c = JSON.parse(pm.collectionVariables.get('accCaso'));
      pm.test('ningún turno se entregó dos veces', () => pm.expect(new Set(c.llamados).size).to.eql(c.llamados.length));
      pm.test('ningún turno del servicio quedó LLAMADO o EN_ATENCION', () => {
        pm.response.json().forEach(t => pm.expect(['LLAMADO', 'EN_ATENCION']).to.not.include(t.estado));
      });
    language: text/javascript
order: 10000
