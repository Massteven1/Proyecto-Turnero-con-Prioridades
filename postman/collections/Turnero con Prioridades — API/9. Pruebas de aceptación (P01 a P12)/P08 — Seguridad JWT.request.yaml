$kind: http-request
name: P08 — Seguridad JWT
description: |-
  Criterio: token ausente, inválido o vencido: 401; desactivar la cuenta o cambiar su rol hace que su token sea rechazado con 401; un OPERADOR que administra usuarios, catálogos o historial: 403; no se puede desactivar o degradar al último ADMIN activo ni modificar usuarios con turnos activos (409).
  La petición consulta usuarios sin token (401). El token vencido necesita la firma del backend: defina la variable jwtSecret con el JWT_SECRET para generarlo; si no está definida, esa aserción queda omitida.
url: "{{baseUrl}}/api/v1/usuarios"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      // Utilidades del caso
      const base = pm.variables.replaceIn('{{baseUrl}}') + '/api/v1';
      const admin = pm.collectionVariables.get('token');
      const opA = pm.collectionVariables.get('accTokenA');
      const opB = pm.collectionVariables.get('accTokenB');
      async function api(metodo, ruta, token, cuerpo) {
        const peticion = { url: base + ruta, method: metodo, header: {} };
        if (token) peticion.header.Authorization = 'Bearer ' + token;
        if (cuerpo !== undefined) {
          peticion.header['Content-Type'] = 'application/json';
          peticion.body = { mode: 'raw', raw: typeof cuerpo === 'string' ? cuerpo : JSON.stringify(cuerpo) };
        }
        const r = await pm.sendRequest(peticion);
        let json = null;
        try { json = r.json(); } catch (e) { json = null; }
        return { status: r.code, json };
      }
      function letras(n) {
        let texto = '';
        for (let i = 0; i < n; i++) texto += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(Math.floor(Math.random() * 26));
        return texto;
      }
      async function crearServicio(prefijo) {
        const s = await api('POST', '/servicios', admin, { codigoPrefijo: prefijo + letras(4), nombre: 'Aceptacion ' + prefijo + ' ' + Date.now(), descripcion: 'Prueba de aceptación' });
        const m = await api('POST', '/modulos', admin, { servicioId: s.json.id, nombre: 'Ventanilla ' + s.json.codigoPrefijo });
        return { id: s.json.id, prefijo: s.json.codigoPrefijo, moduloId: m.json.id };
      }
      async function crearModulo(servicioId, nombre) {
        return (await api('POST', '/modulos', admin, { servicioId, nombre: nombre + ' ' + Date.now() })).json.id;
      }
      async function emitir(servicioId, categoriaId, token) {
        const cliente = 'CC ' + Math.floor(1000000 + Math.random() * 9000000) + ' - Prueba';
        return (await api('POST', '/turnos', token || opA, { identificadorCliente: cliente, servicioId, categoriaId })).json;
      }
      function llamar(moduloId, token) {
        return api('POST', '/modulos/' + moduloId + '/siguiente', token || opA);
      }
      function cambiar(id, nuevoEstado, token, motivo) {
        return api('PATCH', '/turnos/' + id + '/estado', token || opA, motivo === undefined ? { nuevoEstado } : { nuevoEstado, motivo });
      }
      function liberar(id, token) {
        return cambiar(id, 'CANCELADO', token, 'Liberado para el siguiente llamado');
      }
      async function contador(servicioId) {
        return (await api('GET', '/parametros-cola', admin)).json.find(e => e.servicioId === servicioId).contadorPreferentes;
      }
      const esperar = (ms) => new Promise(resolver => setTimeout(resolver, ms));
      const caso = () => JSON.parse(pm.collectionVariables.get('accCaso'));

      const s = await crearServicio('JWT');
      await emitir(s.id, 4);
      pm.collectionVariables.set('accCaso', JSON.stringify({ moduloId: s.moduloId }));
    language: text/javascript
  - type: afterResponse
    code: |-
      // Utilidades del caso
      const base = pm.variables.replaceIn('{{baseUrl}}') + '/api/v1';
      const admin = pm.collectionVariables.get('token');
      const opA = pm.collectionVariables.get('accTokenA');
      const opB = pm.collectionVariables.get('accTokenB');
      async function api(metodo, ruta, token, cuerpo) {
        const peticion = { url: base + ruta, method: metodo, header: {} };
        if (token) peticion.header.Authorization = 'Bearer ' + token;
        if (cuerpo !== undefined) {
          peticion.header['Content-Type'] = 'application/json';
          peticion.body = { mode: 'raw', raw: typeof cuerpo === 'string' ? cuerpo : JSON.stringify(cuerpo) };
        }
        const r = await pm.sendRequest(peticion);
        let json = null;
        try { json = r.json(); } catch (e) { json = null; }
        return { status: r.code, json };
      }
      function letras(n) {
        let texto = '';
        for (let i = 0; i < n; i++) texto += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(Math.floor(Math.random() * 26));
        return texto;
      }
      async function crearServicio(prefijo) {
        const s = await api('POST', '/servicios', admin, { codigoPrefijo: prefijo + letras(4), nombre: 'Aceptacion ' + prefijo + ' ' + Date.now(), descripcion: 'Prueba de aceptación' });
        const m = await api('POST', '/modulos', admin, { servicioId: s.json.id, nombre: 'Ventanilla ' + s.json.codigoPrefijo });
        return { id: s.json.id, prefijo: s.json.codigoPrefijo, moduloId: m.json.id };
      }
      async function crearModulo(servicioId, nombre) {
        return (await api('POST', '/modulos', admin, { servicioId, nombre: nombre + ' ' + Date.now() })).json.id;
      }
      async function emitir(servicioId, categoriaId, token) {
        const cliente = 'CC ' + Math.floor(1000000 + Math.random() * 9000000) + ' - Prueba';
        return (await api('POST', '/turnos', token || opA, { identificadorCliente: cliente, servicioId, categoriaId })).json;
      }
      function llamar(moduloId, token) {
        return api('POST', '/modulos/' + moduloId + '/siguiente', token || opA);
      }
      function cambiar(id, nuevoEstado, token, motivo) {
        return api('PATCH', '/turnos/' + id + '/estado', token || opA, motivo === undefined ? { nuevoEstado } : { nuevoEstado, motivo });
      }
      function liberar(id, token) {
        return cambiar(id, 'CANCELADO', token, 'Liberado para el siguiente llamado');
      }
      async function contador(servicioId) {
        return (await api('GET', '/parametros-cola', admin)).json.find(e => e.servicioId === servicioId).contadorPreferentes;
      }
      const esperar = (ms) => new Promise(resolver => setTimeout(resolver, ms));
      const caso = () => JSON.parse(pm.collectionVariables.get('accCaso'));

      pm.test('sin token: 401', () => pm.response.to.have.status(401));
      const b64url = (palabras) => CryptoJS.enc.Base64.stringify(palabras).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
      const firmar = (datos, secreto) => {
        const cuerpo = b64url(CryptoJS.enc.Utf8.parse(JSON.stringify({ alg: 'HS256' }))) + '.' + b64url(CryptoJS.enc.Utf8.parse(JSON.stringify(datos)));
        return cuerpo + '.' + b64url(CryptoJS.HmacSHA256(cuerpo, secreto));
      };
      const ahora = Math.floor(Date.now() / 1000);
      const alterado = admin.slice(0, -2) + (admin.endsWith('AA') ? 'BB' : 'AA');
      const invalidos = [
        ['token mal formado', 'no.es.un.jwt'],
        ['firma alterada', alterado],
        ['firmado con otro secreto', firmar({ sub: '1', rol: 'ADMIN', iat: ahora, exp: ahora + 600 }, 'otro-secreto-que-no-es-el-del-backend-0001')]
      ];
      for (const [nombre, token] of invalidos) {
        const r = await api('GET', '/usuarios', token);
        pm.test(nombre + ': 401', () => pm.expect(r.status).to.eql(401));
      }
      const secreto = pm.variables.get('jwtSecret');
      if (secreto) {
        const vigente = await api('GET', '/usuarios', firmar({ sub: '1', rol: 'ADMIN', iat: ahora - 60, exp: ahora + 600 }, secreto));
        const vencido = await api('GET', '/usuarios', firmar({ sub: '1', rol: 'ADMIN', iat: ahora - 7200, exp: ahora - 3600 }, secreto));
        pm.test('token vencido: 401 (el mismo token vigente responde 200)', () => pm.expect([vigente.status, vencido.status]).to.eql([200, 401]));
      } else {
        pm.test.skip('token vencido: 401 (defina jwtSecret para generarlo)', () => {});
      }
      async function cuentaNueva(sufijo) {
        const username = 'acc_jwt_' + sufijo + '_' + Date.now();
        const nombre = 'Usuario JWT ' + sufijo;
        const u = (await api('POST', '/usuarios', admin, { username, nombreCompleto: nombre, password: 'Aceptacion123*', rol: 'OPERADOR' })).json;
        const token = (await api('POST', '/auth/login', null, { username, password: 'Aceptacion123*' })).json.token;
        return { id: u.id, nombre, token };
      }
      const baja = await cuentaNueva('baja');
      const antesBaja = await api('GET', '/modulos', baja.token);
      await api('PUT', '/usuarios/' + baja.id, admin, { nombreCompleto: baja.nombre, rol: 'OPERADOR', activo: false });
      const despuesBaja = await api('GET', '/modulos', baja.token);
      pm.test('cuenta desactivada: su token pasa de 200 a 401', () => pm.expect([antesBaja.status, despuesBaja.status]).to.eql([200, 401]));
      const rol = await cuentaNueva('rol');
      const antesRol = await api('GET', '/modulos', rol.token);
      await api('PUT', '/usuarios/' + rol.id, admin, { nombreCompleto: rol.nombre, rol: 'ADMIN', activo: true });
      const despuesRol = await api('GET', '/modulos', rol.token);
      await api('PUT', '/usuarios/' + rol.id, admin, { nombreCompleto: rol.nombre, rol: 'ADMIN', activo: false });
      pm.test('cambio de rol: el token anterior pasa de 200 a 401', () => pm.expect([antesRol.status, despuesRol.status]).to.eql([200, 401]));
      const prohibidas = [
        ['GET', '/usuarios'],
        ['POST', '/usuarios', { username: 'acc_intruso', nombreCompleto: 'Intruso', password: 'Intruso123*', rol: 'ADMIN' }],
        ['POST', '/servicios', { codigoPrefijo: 'INTRUSO', nombre: 'Intruso', descripcion: '' }],
        ['PUT', '/servicios/1', { nombre: 'Caja General', descripcion: '', activo: false }],
        ['POST', '/modulos', { servicioId: 1, nombre: 'Modulo intruso' }],
        ['PUT', '/categorias/4', { nombre: 'Normal' }],
        ['PUT', '/parametros-cola/1', { umbralEnvejecimientoMin: 15, proporcionPreferente: 3 }],
        ['GET', '/turnos?modo=HISTORIAL'],
        ['GET', '/turnos/indicadores']
      ];
      const codigos = [];
      for (const [metodo, ruta, cuerpo] of prohibidas) codigos.push((await api(metodo, ruta, opA, cuerpo)).status);
      pm.test('OPERADOR en usuarios, catálogos, parámetros, historial e indicadores: 403', () => pm.expect(codigos).to.eql(prohibidas.map(() => 403)));
      const admins = (await api('GET', '/usuarios', admin)).json.filter(u => u.rol === 'ADMIN' && u.activo);
      if (admins.length === 1) {
        const unico = admins[0];
        const desactivar = await api('PUT', '/usuarios/' + unico.id, admin, { nombreCompleto: unico.nombreCompleto, rol: 'ADMIN', activo: false });
        const degradar = await api('PUT', '/usuarios/' + unico.id, admin, { nombreCompleto: unico.nombreCompleto, rol: 'OPERADOR', activo: true });
        pm.test('desactivar o degradar al último ADMIN activo: 409', () => pm.expect([desactivar.status, degradar.status]).to.eql([409, 409]));
      } else {
        pm.test.skip('desactivar o degradar al último ADMIN activo: 409 (hay ' + admins.length + ' ADMIN activos)', () => {});
      }
      const c = caso();
      const llamado = await llamar(c.moduloId, opA);
      const idA = pm.collectionVariables.get('accIdA');
      const nombreA = pm.collectionVariables.get('accNombreA');
      const bajaA = await api('PUT', '/usuarios/' + idA, admin, { nombreCompleto: nombreA, rol: 'OPERADOR', activo: false });
      const rolA = await api('PUT', '/usuarios/' + idA, admin, { nombreCompleto: nombreA, rol: 'ADMIN', activo: true });
      pm.test('desactivar o cambiar el rol de una cuenta con turno activo: 409', () => {
        pm.expect(llamado.status).to.eql(200);
        pm.expect([bajaA.status, rolA.status]).to.eql([409, 409]);
      });
      await liberar(llamado.json.turno.id);
    language: text/javascript
order: 9000
