$kind: http-request
description: |-
  Un id no numérico no llega al servicio: la conversión del @PathVariable falla y
  el manejador global responde 400 con el ErrorResponseDTO.
url: "{{baseUrl}}/api/v1/turnos/abc"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      const r = pm.response.json();
      pm.test('ErrorResponseDTO del 400', () => {
        pm.expect(r.status).to.eql(400);
        pm.expect(r.mensaje).to.include("'id'");
        pm.expect(r.ruta).to.eql('/api/v1/turnos/abc');
      });
    language: text/javascript
order: 44600
