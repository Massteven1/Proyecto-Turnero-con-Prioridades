$kind: http-request
description: |-
  Segundo turno preferente (categoría 2, Embarazada): consecutivo 003.
url: "{{baseUrl}}/api/v1/turnos"
method: POST
headers:
  Authorization: Bearer {{tokenOperador}}
  Content-Type: application/json
body:
  type: text
  content: '{"identificadorCliente":"CC 7003 - Preferente Dos","servicioId":{{consultaServicioId}},"categoriaId":2}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.collectionVariables.set('consultaPreferente2Codigo', r.codigo);
      pm.test('consecutivo diario 003', () => pm.expect(r.consecutivo).to.eql(3));
      pm.test('preferente efectivo', () => {
        pm.expect(r.preferenteEfectivo).to.eql(true);
        pm.expect(r.conjuntoEfectivo).to.eql('PREFERENTE');
        pm.expect(r.categoriaOriginalNombre).to.eql('Embarazada');
      });
    language: text/javascript
order: 40400
