$kind: http-request
description: |-
  Ventanilla del servicio de consulta. Guarda {{consultaModuloId}} y
  {{consultaModuloNombre}}: el módulo es el que recibe el llamado real del final
  de la carpeta.
url: "{{baseUrl}}/api/v1/modulos"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: '{"servicioId":{{consultaServicioId}},"nombre":"Modulo Consulta {{consultaServicioPrefijo}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.collectionVariables.set('consultaModuloId', String(r.id));
      pm.collectionVariables.set('consultaModuloNombre', r.nombre);
      pm.test('pertenece al servicio de consulta y nace libre', () => {
        pm.expect(String(r.servicioId)).to.eql(pm.collectionVariables.get('consultaServicioId'));
        pm.expect(r.ocupado).to.eql(false);
        pm.expect(r.turnoActivoCodigo).to.eql(null);
      });
    language: text/javascript
order: 40100
