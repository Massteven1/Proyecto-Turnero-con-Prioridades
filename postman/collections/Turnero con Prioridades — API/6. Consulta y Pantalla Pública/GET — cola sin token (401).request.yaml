$kind: http-request
description: |-
  GET /turnos está protegido: sin token la petición no llega al controlador y
  responde 401.
url: "{{baseUrl}}/api/v1/turnos?modo=COLA&servicioId={{consultaServicioId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized sin token', () => pm.response.to.have.status(401));
    language: text/javascript
order: 41300
