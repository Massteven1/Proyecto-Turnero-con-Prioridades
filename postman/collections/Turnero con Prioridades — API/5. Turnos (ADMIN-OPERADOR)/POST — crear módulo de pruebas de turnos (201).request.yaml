$kind: http-request
description: |-
  Módulo del servicio de pruebas donde se llaman los turnos de la Fase 3.
  El script previo genera {{turnoModuloNombre}}; el test guarda {{turnoModuloId}}.
url: "{{baseUrl}}/api/v1/modulos"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: '{"servicioId":{{turnoServicioId}},"nombre":"{{turnoModuloNombre}}"}'
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('turnoModuloNombre', 'Modulo Turnos ' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.collectionVariables.set('turnoModuloId', String(r.id));
      pm.test('nace activo y libre', () => {
        pm.expect(r.activo).to.eql(true);
        pm.expect(r.ocupado).to.eql(false);
        pm.expect(r.turnoActivoCodigo).to.eql(null);
      });
      pm.test('pertenece al servicio de turnos', () => pm.expect(String(r.servicioId)).to.eql(pm.collectionVariables.get('turnoServicioId')));
    language: text/javascript
order: 37100