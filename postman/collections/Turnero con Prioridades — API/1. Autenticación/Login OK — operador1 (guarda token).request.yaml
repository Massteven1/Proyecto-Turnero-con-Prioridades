$kind: http-request
description: |-
  Cuenta semilla operador1 / Operador123!. Guarda el token en {{tokenOperador}} (no pisa {{token}}, que queda para ADMIN).
  Si el login falla con 401, la cuenta está desactivada: restaurá activo=1 por SQL.
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"username":"operador1","password":"Operador123!"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.collectionVariables.set('tokenOperador', r.token);
      pm.test('rol OPERADOR', () => pm.expect(r.rol).to.eql('OPERADOR'));
    language: text/javascript
order: 2000
