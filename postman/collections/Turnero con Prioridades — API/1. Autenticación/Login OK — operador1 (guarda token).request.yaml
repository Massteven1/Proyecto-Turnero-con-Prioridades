$kind: http-request
description: Cuenta semilla operador1 / Operador123!. Útil para probar permisos por rol (403 del ADMIN-only).
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"username":"operador1","password":"Operador123!"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.collectionVariables.set('token', r.token);
      pm.collectionVariables.set('rol', r.rol);
      pm.collectionVariables.set('usuarioId', String(r.usuarioId));
      pm.test('rol OPERADOR', () => pm.expect(r.rol).to.eql('OPERADOR'));
    language: text/javascript
order: 2000
