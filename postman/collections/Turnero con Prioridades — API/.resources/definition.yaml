$kind: collection
description: |-
  Colección de pruebas del backend Spring Boot, construida por fases según docs/ (contrato de endpoints del xlsx).

  Fase 1 — Autenticación JWT: login, errores 400/401 del ErrorResponseDTO y verificación del filtro de revalidación.
  Fase 2a — Usuarios (ADMIN): CRUD, filtros, BCrypt, 409 por turno activo y por último ADMIN, 403 por rol.
  Fase 2b — Catálogos: servicios (alta con estado de cola 1:1, prefijo inmutable, baja con cascada), módulos (nombre único normalizado, ocupación, historial), categorías (solo renombre) y parámetros de cola (rangos y ajuste del contador).
  Las siguientes fases agregan sus endpoints aquí mismo.
