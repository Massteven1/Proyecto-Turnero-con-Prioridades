$kind: http-request
description: |-
  operador1 (id 2 de la semilla) tiene un turno en estado LLAMADO → no se puede desactivar: 409.
  Si este test falla con 200, la regla no se está aplicando; volvé a dejarlo activo por SQL.
url: "{{baseUrl}}/api/v1/usuarios/2"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: '{"nombreCompleto":"Carlos Perez - Cajero 1","password":null,"rol":"OPERADOR","activo":false}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 Conflict por turno activo', () => pm.response.to.have.status(409));
      const r = pm.response.json();
      pm.test('mensaje menciona el turno activo', () => pm.expect(r.mensaje).to.match(/turno activo/i));
    language: text/javascript
order: 7000
