$kind: http-request
description: 'activo=xyz no es booleano → 400 con ErrorResponseDTO (no 500).'
url: "{{baseUrl}}/api/v1/usuarios?activo=xyz"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      const r = pm.response.json();
      pm.test('mensaje identifica el parámetro', () => pm.expect(r.mensaje).to.include('activo'));
      pm.test('ruta del ErrorResponseDTO', () => pm.expect(r.ruta).to.eql('/api/v1/usuarios'));
    language: text/javascript
order: 3000
