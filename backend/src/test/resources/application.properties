spring.datasource.url=jdbc:h2:mem:turnero_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Propiedades de seguridad para el contexto de prueba (el secret de test no es real)
app.jwt.secret=secreto-de-prueba-para-el-contexto-de-tests-no-usar-en-produccion-0000
app.jwt.vigencia-ms=7200000
