# ============================================================================
# Plantilla de configuracion del backend (Turnero con Prioridades).
# Este archivo NO se carga automaticamente: es la REFERENCIA de la documentacion.
# Para usarlo: copiarlo a application.yml (o definir las variables de entorno
# del sistema) con valores reales, y NUNCA subir credenciales a Git.
# Las variables que exige la documentacion son:
#   DB_URL, DB_USERNAME, DB_PASSWORD (conexion MySQL/MariaDB)
#   JWT_SECRET (OBLIGATORIA: sin ella la aplicacion no arranca)
#   JWT_EXPIRATION_MS (opcional, 7200000 = 2 horas por defecto)
# Opcionales de endurecimiento:
#   LOGIN_MAX_INTENTOS, LOGIN_VENTANA_MINUTOS (limite de fallos por username)
#   SWAGGER_ENABLED (false apaga Swagger UI y /v3/api-docs en produccion)
# Sintaxis ${VAR:default}: usa la variable de entorno si existe, si no el default.
# JWT_SECRET no tiene default a proposito: el secreto de firma debe vivir solo
# en el entorno (o en un application.yml local excluido del repositorio).
# ============================================================================
spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banco_turnero_db?serverTimezone=America/Bogota}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    time-zone: America/Bogota

app:
  jwt:
    # Generar con: [Convert]::ToBase64String((1..48 | % { Get-Random -Max 256 }))
    # Minimo 32 bytes: la aplicacion valida la longitud al arrancar.
    secret: ${JWT_SECRET}
    vigencia-ms: ${JWT_EXPIRATION_MS:7200000}
  login:
    max-intentos: ${LOGIN_MAX_INTENTOS:5}
    ventana-minutos: ${LOGIN_VENTANA_MINUTOS:15}

# Swagger UI y /v3/api-docs: apagar en produccion con SWAGGER_ENABLED=false.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}