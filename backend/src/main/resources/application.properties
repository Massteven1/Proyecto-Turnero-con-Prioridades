spring.application.name=backend

# ---------------------------------------------------------------------------
# Base de datos (XAMPP/phpMyAdmin, banco_turnero_db):
# las credenciales llegan por variables de entorno (ver application-example.yml).
# Los valores por defecto sirven para un XAMPP local con root sin contrasena.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco_turnero_db?serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA: el esquema lo crea db/banco_turnero_db.sql (MariaDB 10.4+ / MySQL 8.0.16+,
# requerido para que el motor aplique las restricciones CHECK y columnas generadas).
# Hibernate solo VALIDA el mapeo de las entidades contra las tablas existentes.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Zona horaria oficial del sistema: America/Bogota (UTC-5) para todos los tiempos.
# ---------------------------------------------------------------------------
spring.jackson.time-zone=America/Bogota

# ---------------------------------------------------------------------------
# Seguridad JWT: secreto y vigencia por variables de entorno (nunca en el repo).
# JWT_SECRET es OBLIGATORIA: sin ella la aplicacion no arranca. Debe ser una
# cadena aleatoria de 32 bytes o mas en UTF-8 (HS256 usa 256 bits); con menos,
# el arranque falla con un mensaje que indica la longitud configurada.
# JWT_EXPIRATION_MS en milisegundos: 7200000 = 2 horas de sesion.
# Ejemplo PowerShell: $env:JWT_SECRET = "<cadena aleatoria larga>"
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.vigencia-ms=${JWT_EXPIRATION_MS:7200000}

# ---------------------------------------------------------------------------
# Limite de intentos fallidos de login por username (429 al agotarlos).
# En memoria, por instancia: suficiente para el alcance del proyecto.
# ---------------------------------------------------------------------------
app.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
app.login.ventana-minutos=${LOGIN_VENTANA_MINUTOS:15}

# ---------------------------------------------------------------------------
# Swagger UI y el contrato OpenAPI. Quedan habilitados por defecto porque son
# un artefacto exigido por la documentacion; en un despliegue real se apagan
# con SWAGGER_ENABLED=false (las rutas dejan de existir).
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
