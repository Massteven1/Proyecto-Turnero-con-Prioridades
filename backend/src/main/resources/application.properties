spring.application.name=backend

# ---------------------------------------------------------------------------
# Base de datos (XAMPP/phpMyAdmin, banco_turnero_db):
# las credenciales llegan por variables de entorno (ver application-example.yml).
# Los valores por defecto sirven para un XAMPP local con root sin contrasena.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco_turnero_db?serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA: el esquema lo crea db/banco_turnero_db.sql (MariaDB 10.4+ / MySQL 8.0.16+,
# requerido para que el motor aplique las restricciones CHECK y columnas generadas).
# Hibernate solo VALIDA el mapeo de las entidades contra las tablas existentes.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Zona horaria oficial del sistema: America/Bogota (UTC-5) para todos los tiempos.
# ---------------------------------------------------------------------------
spring.jackson.time-zone=America/Bogota

# ---------------------------------------------------------------------------
# Seguridad JWT: secreto y vigencia por variables de entorno (nunca en el repo).
# JWT_SECRET es OBLIGATORIA: sin ella la aplicacion no arranca. Debe ser una
# cadena aleatoria de 32 caracteres o mas (HS256 usa 256 bits).
# JWT_EXPIRATION_MS en milisegundos: 7200000 = 2 horas de sesion.
# Ejemplo PowerShell: $env:JWT_SECRET = "<cadena aleatoria larga>"
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.vigencia-ms=${JWT_EXPIRATION_MS:7200000}
